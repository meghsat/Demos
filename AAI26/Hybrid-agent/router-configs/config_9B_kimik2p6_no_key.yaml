version: v0.3
listeners:
    - name: http-8899
      address: 0.0.0.0
      port: 8899
      timeout: 2400s
providers:
    defaults:
        default_model: Qwen3.5-9B-NoThinking
    models:
        - name: Qwen3.5-9B-NoThinking
          pricing:
              currency: USD
              prompt_per_1m: 0.10
              completion_per_1m: 0.20
          backend_refs:
            - name: lemonade-small
              protocol: http
              weight: 100
              base_url: http://host.docker.internal:13305/v1
              provider: openai
              api_key: lemonade
        - name: accounts/fireworks/models/kimi-k2p6
          pricing:
              currency: USD
              prompt_per_1m: 3.00
              completion_per_1m: 9.00
          backend_refs:
            - name: fireworks-kimi
              protocol: http
              weight: 100
              base_url: https://api.fireworks.ai/inference/v1
              provider: openai
              api_key: 
routing:
    modelCards:
        - name: Qwen3.5-9B-NoThinking
          param_size: 9B
          context_window_size: 256000
          description: Fast local 9B model for simple queries and general questions.
          capabilities: [chat]
          quality_score: 0.75
          modality: ar
          tags: [local, fast, default]
        - name: accounts/fireworks/models/kimi-k2p6
          param_size: 1028B
          context_window_size: 262000
          description: Moonshot AI Kimi K2 1028B MoE frontier cloud model for complex reasoning, research, vision, and tasks beyond local capacity.
          capabilities: [chat, reasoning, long-context, vision]
          quality_score: 0.99
          modality: ar
          tags: [cloud, frontier, vision, powerful]

    signals:
        keywords:
            - name: complex_task_keywords
              operator: OR
              method: bm25
              keywords:
                  - "system design"
                  - "software architecture"
                  - "implement"
                  - "refactor"
                  - "root cause analysis"
                  - "tradeoff"
                  - "distributed system"
                  - "scalability"
                  - "query optimization"
                  - "algorithm design"
                  - "machine learning"
                  - "neural network"
                  - "fault tolerance"
                  - "concurrency"
                  - "performance bottleneck"
              case_sensitive: false
              bm25_threshold: 0.25

            - name: simple_query_keywords
              operator: OR
              method: bm25
              keywords:
                  - "what is"
                  - "define"
                  - "list"
                  - "how do i"
                  - "what does"
                  - "when was"
                  - "who is"
                  - "where is"
                  - "example of"
              case_sensitive: false
              bm25_threshold: 0.15

            - name: expert_domain_keywords
              operator: OR
              method: bm25
              keywords:
                  - "theorem"
                  - "prove"
                  - "derive"
                  - "derivation"
                  - "cryptography"
                  - "kernel"
                  - "compiler"
                  - "operating system"
                  - "distributed consensus"
              case_sensitive: false
              bm25_threshold: 0.20

        domains:
            - name: "computer science"
              description: Computer science, algorithms, software engineering.
              mmlu_categories: ["computer science"]

            - name: math
              description: Mathematics, statistics, formal proofs.
              mmlu_categories: ["math"]

            - name: general
              description: General knowledge and simple factual queries.
              mmlu_categories: ["other"]

        structure:
            - name: multi_step_request
              description: Requests with numbered steps or ordered workflows.
              feature:
                  type: exists
                  source:
                      type: regex
                      pattern: '(?m)^\s*\d+\.\s+'

            - name: long_query
              description: Queries longer than ~400 words suggesting a complex task.
              feature:
                  type: count
                  source:
                      type: regex
                      pattern: '\S+'
              predicate:
                  gte: 400

            - name: short_query
              description: Queries shorter than ~30 words suggesting a simple task.
              feature:
                  type: count
                  source:
                      type: regex
                      pattern: '\S+'
              predicate:
                  lte: 30

            - name: any_query
              description: Matches any non-empty query (catch-all for default routing).
              feature:
                  type: count
                  source:
                      type: regex
                      pattern: '\S+'
              predicate:
                  gte: 1

        context:
            - name: large_context
              min_tokens: 8K
              max_tokens: 262K
              description: Large context requests routed to Kimi K2 cloud.

        complexity:
            - name: needs_reasoning
              threshold: 0.28
              description: MMBERT-scored route for synthesis-heavy and multi-step reasoning prompts.
              hard:
                  candidates:
                      - analyze the root cause step by step and compare multiple mitigation strategies
                      - derive and prove this formula or theorem mathematically with formal justification
                      - explain the tradeoffs between different approaches in depth and recommend the best one
                      - implement a complete solution handling all edge cases and failure modes
                      - design a system architecture that satisfies multiple conflicting constraints
                      - debug this complex issue by tracing through the execution path and identifying the fault
                      - optimize this algorithm or system for time complexity and memory usage
                      - synthesize findings from multiple sources and draw a well-reasoned conclusion
              easy:
                  candidates:
                      - what is the definition of this term
                      - give a quick one-sentence answer
                      - briefly summarize this in a few words
                      - what does this word or acronym mean
                      - answer yes or no to this simple question
                      - translate this short phrase into another language
                      - convert this value from one unit to another
                      - what is the capital city of this country

        jailbreak:
            - name: prompt_injection
              method: hybrid
              threshold: 0.85
              description: Detects jailbreak and prompt injection attempts.

        pii:
            - name: sensitive_pii
              threshold: 0.7
              description: Detects personally identifiable information in the query.

    decisions:
        # Priority 1000 — security guard: jailbreak or PII → 9B only
        - name: route_security_guard
          description: Queries flagged for jailbreak or PII are kept on the local 9B model.
          priority: 1000
          rules:
              operator: OR
              conditions:
                  - type: jailbreak
                    name: prompt_injection
                  - type: pii
                    name: sensitive_pii
          modelRefs:
              - model: Qwen3.5-9B-NoThinking
                use_reasoning: false
          algorithm:
              type: static

        # Priority 700 — any complex or expert signal → Kimi K2 cloud directly
        - name: route_cloud_complex
          description: Complex keywords, expert domain, multi-step structure, long queries, or large context routed directly to Kimi K2.
          priority: 700
          rules:
              operator: OR
              conditions:
                  - type: keyword
                    name: complex_task_keywords
                  - type: keyword
                    name: expert_domain_keywords
                  - type: structure
                    name: multi_step_request
                  - type: structure
                    name: long_query
                  - type: context
                    name: large_context
          modelRefs:
              - model: accounts/fireworks/models/kimi-k2p6
                use_reasoning: false
          algorithm:
              type: static

        # Priority 400 — medium complexity confidence loop: 9B → Kimi K2
        - name: route_confidence_cloud
          description: Medium-complexity queries — tries 9B first, escalates to Kimi K2 if confidence is below threshold.
          priority: 400
          rules:
              operator: AND
              conditions:
                  - type: complexity
                    name: needs_reasoning:medium
          modelRefs:
              - model: Qwen3.5-9B-NoThinking
                use_reasoning: false
              - model: accounts/fireworks/models/kimi-k2p6
                use_reasoning: false
          algorithm:
              type: confidence
              confidence:
                  confidence_method: self_verify
                  threshold: 0.8
                  escalation_order: cost
                  cost_quality_tradeoff: 0.3

        # Priority 300 — simple keywords + short query → 9B
        - name: route_small_simple
          description: Simple factual or short queries routed to the fast 9B model.
          priority: 300
          rules:
              operator: OR
              conditions:
                  - operator: AND
                    conditions:
                        - type: keyword
                          name: simple_query_keywords
                        - type: structure
                          name: short_query
          modelRefs:
              - model: Qwen3.5-9B-NoThinking
                use_reasoning: false
          algorithm:
              type: static

        # Priority 100 — catch-all → 9B
        - name: route_small_default
          description: Default fallback for all unmatched queries.
          priority: 100
          rules:
              operator: OR
              conditions:
                  - type: structure
                    name: any_query
          modelRefs:
              - model: Qwen3.5-9B-NoThinking
                use_reasoning: false
          algorithm:
              type: static
global:
    router:
        config_source: file
        auto_model_name: MoM
        include_config_models_in_list: false
        clear_route_cache: true
        streamed_body:
            enabled: false
        skip_processing:
            enabled: false
        model_selection:
            method: static
            enabled: true
    services:
        api:
            batch_classification: {}
        response_api:
            enabled: true
            store_backend: redis
            ttl_seconds: 86400
            max_responses: 1000
        observability:
            tracing:
                enabled: true
                provider: opentelemetry
                exporter:
                    type: otlp
                    endpoint: vllm-sr-jaeger:4317
                    insecure: true
                sampling:
                    type: always_on
                    rate: 1
                resource:
                    service_name: vllm-sr
                    service_version: v0.3.0
                    deployment_environment: development
            metrics:
                enabled: true
                windowed_metrics:
                    enabled: false
                    model_metrics: false
                    queue_depth_estimation: false
        authz: {}
        ratelimit: {}
        router_replay:
            enabled: true
            store_backend: postgres
            ttl_seconds: 2592000
        startup_status:
            store_backend: file
    stores:
        semantic_cache:
            backend_type: memory
            enabled: true
            max_entries: 1000
            ttl_seconds: 3600
            eviction_policy: fifo
        memory:
            milvus:
                address: ""
                collection: agentic_memory
                dimension: 384
            extraction_batch_size: 10
            default_retrieval_limit: 5
            default_similarity_threshold: 0.7
    integrations:
        tools:
            enabled: false
            top_k: 3
            tools_db_path: config/tools_db.json
            fallback_to_empty: true
        looper:
            endpoint: http://vllm-sr-envoy-container:8899/v1/chat/completions
            timeout_seconds: 1200
    model_catalog:
        embeddings:
            semantic:
                qwen3_model_path: ""
                gemma_model_path: ""
                mmbert_model_path: models/mmbert-embed-32k-2d-matryoshka
                bert_model_path: ""
                use_cpu: true
                embedding_config:
                    model_type: mmbert
                    preload_embeddings: true
                    target_dimension: 768
                    target_layer: 22
                    enable_soft_matching: true
                    top_k: 1
                    min_score_threshold: 0.5
        system:
            prompt_guard: models/mmbert32k-jailbreak-detector-merged
            domain_classifier: models/mmbert32k-intent-classifier-merged
            pii_classifier: models/mmbert32k-pii-detector-merged
            fact_check_classifier: models/mmbert32k-factcheck-classifier-merged
            feedback_detector: models/mmbert32k-feedback-detector-merged
        modules:
            prompt_compression:
                enabled: false
                max_tokens: 0
            prompt_guard:
                enabled: true
                model_id: ""
                threshold: 0.7
                use_cpu: true
                use_modernbert: false
                use_mmbert_32k: true
                jailbreak_mapping_path: models/mmbert32k-jailbreak-detector-merged/jailbreak_type_mapping.json
                model_ref: prompt_guard
            classifier:
                domain:
                    model_id: ""
                    threshold: 0.5
                    use_cpu: true
                    use_modernbert: false
                    use_mmbert_32k: true
                    category_mapping_path: models/mmbert32k-intent-classifier-merged/category_mapping.json
                    model_ref: domain_classifier
                mcp:
                    enabled: false
                    transport_type: ""
                    threshold: 0
                pii:
                    model_id: ""
                    threshold: 0.7
                    use_cpu: true
                    use_mmbert_32k: true
                    pii_mapping_path: models/mmbert32k-pii-detector-merged/pii_type_mapping.json
                    model_ref: pii_classifier
                preference:
                    use_contrastive: true
            complexity:
                prototype_scoring:
                    enabled: true
                    cluster_similarity_threshold: 0.9
                    max_prototypes: 8
                    best_weight: 0.75
                    top_m: 2
            feedback_detector:
                enabled: true
                model_id: ""
                threshold: 0.7
                use_cpu: true
                use_modernbert: false
                use_mmbert_32k: true
                feedback_mapping_path: ""
                model_ref: feedback_detector
            modality_detector:
                enabled: false
